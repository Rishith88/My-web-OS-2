<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi OS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden; 
            font-family: 'Orbitron', sans-serif;
            user-select: none;
        }
        
        .Landing-Screen {
           width: 100vw;
           height: 100vh;
           background-image: url('Images/Avengers.jpg');
           background-size: cover;
           background-repeat: no-repeat;
           background-position: center;
           position: relative;
           box-sizing: border-box;
           padding: 40px;
        }

        .desktop {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-gap: 20px;
            width: 100%;
            height: calc(100% - 100px);
            align-content: start;
            margin-top: 20px;
        }

        .desktop button, .appIcon {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            font-family: inherit;
        }

        .desktop button:hover, .appIcon:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .desktop button img, .appIcon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .desktop button span, .appIcon span {
            font-size: 10px;
            text-align: center;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .app-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 8px !important;
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .full-page {
            width: 100%;
            height: 100%;
            background-color: black;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center; 
            align-items: center; 
            animation: fadeout 5s ease-in-out forwards;    
            z-index: 99999; 
            pointer-events: none;
        }

        .full-page h1 {
            color: white;
            font-weight: 800;
            font-size: 80px;
            margin: 0;               
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px #00d2ff;
        }

        .status-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; 
            z-index: 50;
        }

        .status-container h2 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-weight: 800;
            font-size: 40px;
            color: white;
            text-align: center;
            animation: fadeouth2 8s ease-in-out forwards;
            text-shadow: 0 0 15px rgba(0,0,0,0.9);
        }

        @keyframes fadeout {
            0% { visibility: visible; opacity: 1; }
            99% { visibility: visible; opacity: 0; }
            100% { visibility: hidden; opacity: 0; }
        }

        @keyframes fadeouth2 {
            0% { visibility: visible; opacity: 1; }
            70% { opacity: 1; }
            99% { visibility: visible; opacity: 0; }
            100% { visibility: hidden; opacity: 0; }
        }

        /* --- MULTI WINDOW SYSTEM STYLES --- */
        #window-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 48px);
            pointer-events: none;
            z-index: 100;
        }

        .os-window {
            pointer-events: auto;
            position: absolute;
            width: 450px;
            height: 550px;
            background: #1e1e24;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.2s ease, height 0.2s ease, top 0.2s ease, left 0.2s ease;
        }

        .os-window.active-window {
            border-color: #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3), 0 10px 30px rgba(0,0,0,0.8);
        }

        .os-window.maximized {
            top: 0px !important;
            left: 0px !important;
            width: 100vw !important;
            height: calc(100vh - 48px) !important;
            border-radius: 0;
        }

        .os-window.minimized {
            display: none !important;
        }

        .titlebar {
            background: #2b2b36;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            cursor: move;
        }

        .titlebar span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .win-btns {
            display: flex;
            gap: 8px;
        }

        .win-btns button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px;
            font-size: 14px;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .win-btns button:hover {
            color: #00d2ff;
        }

        .win-btns button.close:hover {
            color: #ff5f56;
        }

        .os-window iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: white;
        }

        /* --- WINDOWS TASKBAR STYLES --- */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            box-sizing: border-box;
            z-index: 10000;
            user-select: none;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .start-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #00d2ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .taskbar-apps {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        .taskbar-app-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
            border: none;
            transition: background 0.2s ease;
            position: relative;
        }

        .taskbar-app-icon:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .taskbar-app-icon.active {
            background: rgba(0, 210, 255, 0.2);
        }

        .taskbar-app-icon.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 16px;
            height: 3px;
            background: #00d2ff;
            border-radius: 2px;
            box-shadow: 0 0 5px #00d2ff;
        }

        .taskbar-app-icon img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .taskbar-right {
            display: flex;
            align-items: center;
            color: white;
            font-size: 11px;
            padding-right: 8px;
        }

        .system-clock {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .system-clock:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .clock-time {
            font-weight: 800;
        }

        .clock-date {
            font-size: 9px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="full-page">
        <h1>Rishi OS</h1>
    </div>

    <div class="Landing-Screen">
        
        <div class="status-container">
            <h2>Desktop Loaded Successfully.....</h2>
        </div>

        <div class="desktop">
            <button class="appIcon" onclick="openApp('Calculator', 'src/calculater.html')">
                <img src="Images/calculater.png" alt="Calculator" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1011/1011863.png'">
                <span class="OpenCalculater">Rishi Calculator</span>
            </button>

            <button class="appIcon" id="stopwatch-icon" title="Stopwatch" onclick="openApp('Stopwatch', 'src/stopwatch.html')">
                <img src="Images/stopwatch.png" alt="Stopwatch" onerror="this.src='https://cdn-icons-png.flaticon.com/512/865/865969.png'">
                <span class="app-badge">Rishi Stopwatch</span>
            </button>

            <button class="appIcon" id="calendar-icon" title="Calendar" onclick="openApp('Calendar', 'src/calendar.html')">
                <img src="Images/calendar.png" alt="Calendar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2693/2693507.png'">
                <span class="app-badge">Rishi Calendar</span>
            </button>

            <button class="appIcon" id="timer-icon" title="Timer" onclick="openApp('Timer', 'src/timer.html')">
                <img src="Images/timer.png" alt="Timer" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3208/3208728.png'">
                <span class="app-badge">Rishi Timer</span>
            </button>

            <button class="appIcon" id="todo-icon" title="Todo App" onclick="openApp('Todo App', 'src/Todo.html')">
                <img src="Images/Todo.png" alt="Todo App" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2387/2387679.png'">
                <span class="app-badge">Rishi Todo</span>
            </button>

            <button class="appIcon" id="notepad-icon" title="Notepad" onclick="openApp('Notepad', 'src/notepad.html')">
                <img src="Images/Notepad Icon.png" alt="Notepad" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3701/3701509.png'">
                <span class="app-badge">Rishi Notepad</span>
            </button>
        </div>
    </div>

    
    <div id="window-container"></div>

    
    <div class="taskbar">
        <div class="taskbar-left">
            <button class="start-btn">
                 Start
            </button>
            <div class="taskbar-apps">
                <button class="taskbar-app-icon" id="tb-calculator" title="Rishi Calculator" onclick="openApp('Calculator', 'src/calculater.html')">
                    <img src="Images/calculater.png" alt="Calculator" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1011/1011863.png'">
                </button>
                <button class="taskbar-app-icon" id="tb-stopwatch" title="Rishi Stopwatch" onclick="openApp('Stopwatch', 'src/stopwatch.html')">
                    <img src="Images/stopwatch.png" alt="Stopwatch" onerror="this.src='https://cdn-icons-png.flaticon.com/512/865/865969.png'">
                </button>
                <button class="taskbar-app-icon" id="tb-calendar" title="Rishi Calendar" onclick="openApp('Calendar', 'src/calendar.html')">
                    <img src="Images/calendar.png" alt="Calendar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2693/2693507.png'">
                </button>
                <button class="taskbar-app-icon" id="tb-timer" title="Rishi Timer" onclick="openApp('Timer', 'src/timer.html')">
                    <img src="Images/timer.png" alt="Timer" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3208/3208728.png'">
                </button>
                <button class="taskbar-app-icon" id="tb-todo-app" title="Rishi Todo" onclick="openApp('Todo App', 'src/Todo.html')">
                    <img src="Images/Todo.png" alt="Todo App" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2387/2387679.png'">
                </button>
                <button class="taskbar-app-icon" id="tb-notepad" title="Rishi Notepad" onclick="openApp('Notepad', 'src/notepad.html')">
                    <img src="Images/Notepad Icon.png" alt="Notepad" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3701/3701509.png'">
                </button>
            </div>
        </div>
        <div class="taskbar-right">
            <div class="system-clock">
                <span class="clock-time" id="taskbar-time">12:00 PM</span>
                <span class="clock-date" id="taskbar-date">10/22/2026</span>
            </div>
        </div>
    </div>

    <script>
        let highestZIndex = 100;
        const windowStates = {};
        let windowCascadeOffset = 0;

        function getAppId(appName) {
            return 'win-' + appName.replace(/\s+/g, '-').toLowerCase();
        }

        function openApp(appName, appUrl) {
            const windowId = getAppId(appName);
            let win = document.getElementById(windowId);

            
            if (win) {
                if (win.classList.contains('minimized')) {
                    win.classList.remove('minimized');
                }
                bringToFront(windowId);
                return;
            }

            
            const container = document.getElementById('window-container');
            win = document.createElement('div');
            win.className = 'os-window';
            win.id = windowId;

            // Cascade initial window positions
            const initialTop = 80 + (windowCascadeOffset * 30);
            const initialLeft = 80 + (windowCascadeOffset * 30);
            windowCascadeOffset = (windowCascadeOffset + 1) % 8;

            win.style.top = initialTop + 'px';
            win.style.left = initialLeft + 'px';

            win.innerHTML = `
                <div class="titlebar" onmousedown="bringToFront('${windowId}')">
                    <span>Rishi ${appName}</span>
                    <div class="win-btns">
                        <button class="win-btn" title="Minimize" onclick="minimizeApp('${windowId}')">—</button>
                        <button class="win-btn" title="Maximize" onclick="maximizeApp('${windowId}')">□</button>
                        <button class="win-btn close" title="Close" onclick="closeApp('${windowId}')">✕</button>
                    </div>
                </div>
                <iframe src="${appUrl}" title="${appName}"></iframe>
            `;

            win.addEventListener('mousedown', () => bringToFront(windowId));
            container.appendChild(win);

            windowStates[windowId] = {
                isMaximized: false,
                top: win.style.top,
                left: win.style.left,
                width: '450px',
                height: '550px'
            };

            makeDraggable(win);
            bringToFront(windowId);
            updateTaskbarActiveState(appName, true);
        }

        function bringToFront(windowId) {
            const win = document.getElementById(windowId);
            if (!win) return;

            highestZIndex++;
            win.style.zIndex = highestZIndex;

            document.querySelectorAll('.os-window').forEach(w => w.classList.remove('active-window'));
            win.classList.add('active-window');
        }

        function closeApp(windowId) {
            const win = document.getElementById(windowId);
            if (win) {
                const appName = win.querySelector('.titlebar span').innerText.replace('Rishi ', '');
                win.remove();
                delete windowStates[windowId];
                updateTaskbarActiveState(appName, false);
            }
        }

        function maximizeApp(windowId) {
            const win = document.getElementById(windowId);
            const state = windowStates[windowId];
            if (!win || !state) return;

            if (!state.isMaximized) {
                state.top = win.style.top;
                state.left = win.style.left;
                state.width = win.style.width;
                state.height = win.style.height;

                win.classList.add('maximized');
                state.isMaximized = true;
            } else {
                win.classList.remove('maximized');
                win.style.top = state.top;
                win.style.left = state.left;
                win.style.width = state.width;
                win.style.height = state.height;
                state.isMaximized = false;
            }
        }

        function minimizeApp(windowId) {
            const win = document.getElementById(windowId);
            if (win) {
                win.classList.add('minimized');
            }
        }

        function updateTaskbarActiveState(appName, isOpen) {
            const cleanName = appName.replace(/\s+/g, '-').toLowerCase();
            const tbBtn = document.getElementById('tb-' + cleanName);
            if (tbBtn) {
                if (isOpen) {
                    tbBtn.classList.add('active');
                } else {
                    tbBtn.classList.remove('active');
                }
            }
        }

        function makeDraggable(win) {
            const titlebar = win.querySelector('.titlebar');
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            titlebar.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON' || win.classList.contains('maximized')) return;
                
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = win.offsetLeft;
                initialTop = win.offsetTop;

                // Prevent iframe mouse capture during drag
                document.querySelectorAll('iframe').forEach(iframe => iframe.style.pointerEvents = 'none');

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            function onMouseMove(e) {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                win.style.left = `${initialLeft + dx}px`;
                win.style.top = `${initialTop + dy}px`;
            }

            function onMouseUp() {
                isDragging = false;
                document.querySelectorAll('iframe').forEach(iframe => iframe.style.pointerEvents = 'auto');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }

        function updateTaskbarClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString();
            
            document.getElementById('taskbar-time').innerText = timeStr;
            document.getElementById('taskbar-date').innerText = dateStr;
        }

        setInterval(updateTaskbarClock, 1000);
        updateTaskbarClock();
    </script>
</body>
</html>
